name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies (acorn, linkedom)
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Physics, scoring, storage and UI tests
        run: npm test

      - name: Verify single-file build is in sync with sources
        run: |
          npm run version:sync
          npm run standalone
          git diff --exit-code -- NERVA.html version.js
